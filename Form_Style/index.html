<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/Form_Style/index.css">

</head>
<body>
    
    <form action="" class="form">

        <h1 class="login-text"><i>Login</i></h1>
        <p class="sub-title">Welcome Back for our webstore. <br>
            Login and order or buy everthing that you want.
        </p>

        <label class="label-input">Email</label><br>
        <input class="input-form" type="email" name="email" placeholder="Enter Email"><br><br>

        <label class="label-input">Password</label><br>
        <input class="input-form" type="password" name="password" placeholder="Enter Password"><br><br>

        <input type="checkbox" name="remember" id="">
        <label for="" style="color: aliceblue;">Remember me.</label><br><br>

        <p class="or">---------------------------Or---------------------------</p><br>
        
        <button class="google-btn">
            <img class="google-logo" src="https://i.pinimg.com/1200x/82/b0/97/82b0978976f4b38fc02881250c0e1f6c.jpg" alt="">
            <span>Google</span>
        </button>
        <br>
        <button class="btn-login">Login</button>

    </form>

</body>
</html>
